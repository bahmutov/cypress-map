name: ci
on: push

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Install everything 📦
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7.4.4
        with:
          runTests: false

      # make sure we did not leave "it.only" accidentally
      # https://github.com/bahmutov/stop-only
      - name: Catch "it.only" 🫴
        run: npm run stop-only

      - name: Lint code ☑️
        run: npm run lint

  test:
    # https://github.com/bahmutov/cypress-workflows
    uses: bahmutov/cypress-workflows/.github/workflows/split.yml@v2
    with:
      nE2E: 3
      build: npm run build

  release:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'

    # trusted publisher
    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      id-token: write

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Print NPM version 📜
        run: npm --version

      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Install everything 📦
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7.4.4
        with:
          runTests: false

      - name: Build dist 🏗
        run: npm run build

      - name: Semantic Release 🚀
        uses: cycjimmy/semantic-release-action@v6
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
